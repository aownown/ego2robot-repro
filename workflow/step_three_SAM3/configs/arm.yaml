# Current workflow choice, approved by the user on 2026-09-11 after 90-frame A/B.
# Local variation from Ego2Robot: prompt=arm; all other settings match paper.yaml.
model: sam3
checkpoint: assets/sam3/sam3.pt
prompt: arm
anchor: middle_frame
propagation_direction: both
chunk_frames: 400
overlap_frames: 50
overlap_merge: bitwise_or
postprocess:
  interpolate_gaps_max_frames: 3
  area_median_window: 11
  minimum_area_ratio: 0.5
  small_area_fallback: nearest_valid
  close_kernel: [5, 5]
  close_shape: ellipse
