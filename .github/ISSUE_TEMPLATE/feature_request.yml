name: Feature request
description: Propose a reproducible extension or validation
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or scientific need does this address?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed approach and validation
    validations:
      required: true
